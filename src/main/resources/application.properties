spring.application.name=isemid

server.port=${SERVER_PORT:8081}

server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=60s

spring.datasource.hikari.pool-name=IsemidHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Logs a WARN (not an error - the connection is not closed) when a connection
# is checked out longer than this without being returned, so a leak surfaces
# in logs/metrics long before the pool actually exhausts. Comfortably below
# max-lifetime above so it never fires on a merely long-lived, healthy borrow.
spring.datasource.hikari.leak-detection-threshold=60000
# Dashboard aggregates scan hundreds of thousands of rows per query; raising
# the per-gather worker cap from Postgres's default of 2 measurably speeds up
# the parallel index scans these queries already use (~150ms -> ~85ms for the
# republic-wide case summary, measured via EXPLAIN ANALYZE against the dev DB).
spring.datasource.hikari.connection-init-sql=SET max_parallel_workers_per_gather = 4

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tashkent
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Every entity carries @Version (see BaseEntity) for optimistic locking.
# Without this flag Hibernate silently drops UPDATE/DELETE statements out of
# the JDBC batch the moment a versioned entity is involved, which is nearly
# always here - so batch_size/order_updates above would otherwise be dead
# weight for most write paths. Safe with the pgjdbc driver already pinned in
# pom.xml, which reports per-statement batch outcomes correctly.
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Normalizes the number of bind parameters generated for an `IN (...)`
# clause (e.g. 5 params always compiles as if 8 were passed) so lookups like
# WHERE id IN (:ids) don't produce a distinct query shape - and a fresh
# entry in Postgres's statement/plan cache - for every different list size.
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.migration/db.changelog-master.yaml

# DevTools restart classloader duplicates classpath entries for this tree, which
# can make Liquibase resolve changelog/data-file paths twice on a hot restart
# (UnknownChangelogFormatException with a doubled resource path). Keeping
# db.migration on the base classloader avoids that.
spring.devtools.restart.exclude=META-INF/maven/**,META-INF/resources/**,resources/**,static/**,public/**,templates/**,**/*Test.class,**/*Tests.class,git.properties,META-INF/build-info.properties,db.migration/**

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.jackson.time-zone=Asia/Tashkent
spring.cache.type=caffeine

management.endpoints.web.base-path=/v1/actuator
# loggers: lets ops change a package's log level at runtime (POST /v1/actuator/loggers/{name})
# without a redeploy. Access is gated by RouteAccessPolicy (authentication required) -
# unlike health/info/prometheus/metrics, this is deliberately NOT in the public whitelist.
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# Note: no micrometer-tracing-bridge-{brave,otel} dependency is on the classpath, so a
# management.tracing.sampling.probability property here would have no effect - trace/span
# correlation currently comes from the app's own TraceContext/MDC (see platform.observability).
# Add the bridge + an exporter dependency first if real distributed tracing is wanted later.

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Without this, Swagger UI defaults to whichever group happens to be first
# in its internal urls list - "Admin" in our case, the wrong first
# impression for most API consumers. Swagger UI matches urls-primary-name
# against each entry's "name" field, which springdoc populates from
# GroupedOpenApi's displayName() (main's is "Основные API",
# i.e. Cyrillic "Osnovnyye API") - NOT the group id "main". Written as a
# \uXXXX escape rather than raw Cyrillic because .properties files are
# parsed as ISO-8859-1 by default - raw Cyrillic here silently mojibakes
# and the primaryName match then silently fails.
springdoc.swagger-ui.urls-primary-name=\u041e\u0441\u043d\u043e\u0432\u043d\u044b\u0435 API

app.observability.trace-id-header=X-Trace-Id
app.observability.accept-incoming-trace-id=true
app.observability.trace-id-min-length=16
app.observability.trace-id-max-length=64
app.observability.trace-id-allowed-separators=-_.:
app.observability.http-logging.enabled=true
app.observability.http-logging.log-successful-requests=true
app.observability.http-logging.slow-request-threshold-ms=1000
app.observability.http-logging.max-text-length=500
app.observability.http-logging.max-user-agent-length=300
app.observability.http-logging.organization-header=X-Organization-Id
app.observability.http-logging.include-query-string=true
app.observability.http-logging.include-user-agent=true
app.observability.http-logging.mask-path-identifiers=true
app.observability.http-logging.excluded-path-prefixes=/favicon.ico,/actuator/health,/v1/actuator/health,/swagger-ui,/v3/api-docs
app.observability.http-logging.sensitive-query-parameters=access_token,refresh_token,token,password,secret,client_secret,api_key,apikey,pinfl,nnuzb,passport,passport_number,birth_certificate,phone,patient_id,patient_identifier,medical_record_number
app.observability.outbound-http-logging.enabled=true
app.observability.outbound-http-logging.log-successful-requests=false
app.observability.outbound-http-logging.slow-request-threshold-ms=2000
app.observability.outbound-http-logging.include-headers=false
app.observability.outbound-http-logging.log-request-body=false
app.observability.outbound-http-logging.log-response-body=false
app.observability.outbound-http-logging.max-body-bytes=16384
app.observability.outbound-http-logging.allowed-text-content-types=application/json,application/*+json,application/xml,application/*+xml,application/x-www-form-urlencoded,text/*
app.observability.async-executor.core-pool-size=${ASYNC_CORE_POOL_SIZE:8}
app.observability.async-executor.max-pool-size=${ASYNC_MAX_POOL_SIZE:32}
app.observability.async-executor.queue-capacity=${ASYNC_QUEUE_CAPACITY:2000}
app.observability.async-executor.keep-alive-seconds=60
app.observability.async-executor.await-termination-seconds=30
app.observability.async-executor.thread-name-prefix=app-async-

app.dev.metrics-stream-interval-ms=${DEV_METRICS_STREAM_INTERVAL_MS:3000}

app.scope.tashkent-region-code=UZ-TK

app.security.http.connect-timeout=3s
app.security.http.read-timeout=5s
app.security.http.connection-request-timeout=2s
app.security.http.connection-time-to-live=5m
app.security.http.evict-idle-connections-after=30s
app.security.http.max-connections=100
app.security.http.max-connections-per-route=50
# The 6 values above are just the startup defaults for the general-purpose
# platform HTTP client (see PlatformRestClientConfig). DynamicHttpTuningInterceptor
# re-resolves all of them, plus max-connections/max-connections-per-route for
# the dedicated API2/LIS clients, on every outbound call from the dev-panel
# system_settings table, under keys:
#   http-client.platform.connect-timeout-millis
#   http-client.platform.read-timeout-millis
#   http-client.platform.connection-request-timeout-millis
#   http-client.platform.connection-time-to-live-seconds
#   http-client.platform.max-connections
#   http-client.platform.max-connections-per-route
#   http-client.api2.connect-timeout-millis        (seeded INACTIVE - see migration)
#   http-client.api2.read-timeout-millis           (seeded INACTIVE - see migration)
#   http-client.api2.max-connections
#   http-client.api2.max-connections-per-route
#   http-client.lis.connect-timeout-millis         (seeded INACTIVE - see migration)
#   http-client.lis.read-timeout-millis            (seeded INACTIVE - see migration)
#   http-client.lis.max-connections
#   http-client.lis.max-connections-per-route
# api2/lis connect/read-timeout are seeded inactive rather than active: their
# real value may come from an env var (API2_CONNECT_TIMEOUT etc.) per
# deployment, so a guessed active row could silently override a legitimately
# different production value - see the migration's own comment
# (db.migration/changelog/settings/20260729-1400-...) for the full reasoning.
# evict-idle-connections-after is NOT dynamic - it is a background eviction
# thread interval fixed at HttpClient build time with no runtime setter.
app.iam.role-sync.create-missing-roles=true

# Base directory DevFileController (/v1/dev/files) browses/downloads under
# DevFileRoot.DOCS. DevFileRoot.LOGS instead reuses logging.file.path (see
# logback-spring.xml, default "logs") directly, so the two stay in sync
# without a second property to drift out of step with the real log location.
app.dev-files.docs-dir=${DOCS_DIR:docs}

# =========================
# Background Excel export (see platform.export)
# =========================
app.export.storage-dir=${EXPORT_STORAGE_DIR:exports}
app.export.max-rows=${EXPORT_MAX_ROWS:200000}
app.export.retention-days=${EXPORT_RETENTION_DAYS:7}
app.export.cleanup-cron=${EXPORT_CLEANUP_CRON:0 0 3 * * *}

# =========================
# Outbound status-change webhooks (see orchestration.webhook)
# =========================
app.crypto.webhook-secret-key=${WEBHOOK_SECRET_KEY:}
integration.webhook.connect-timeout=${WEBHOOK_CONNECT_TIMEOUT:3s}
integration.webhook.read-timeout=${WEBHOOK_READ_TIMEOUT:10s}
app.webhook.dispatch-poll-interval-ms=${WEBHOOK_DISPATCH_POLL_INTERVAL_MS:15000}
# The two values above are just the startup defaults for the retry schedule
# and per-poll batch size - DynamicCircuitBreakerLookup-style re-resolution
# doesn't apply here, but RetryPolicyResolver re-reads both from the
# dev-panel system_settings table on every poll, under keys:
#   webhook.dispatch.backoff-schedule   (default PT1M,PT5M,PT15M,PT1H,PT6H)
#   webhook.dispatch.batch-size         (default 50)
# Both are pre-seeded (see db.migration/changelog/webhook/20260805-1030-...)
# so they show up in the dev panel ready to edit.

# =========================
# Circuit breakers - outbound HTTP integrations (see platform.resilience)
# =========================
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=4s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-state=true

# API2 - one shared instance: Citizen and LegalEntity clients share the same
# connection pool/base URL, so one breaker reflects "is API2 up". Registered
# as a config *template* (not resilience4j.circuitbreaker.instances.api2),
# same as iam-remote/oauth2-login/rsa-public-key below - Spring Boot's
# resilience4j auto-configuration only makes an entry under configs.*
# retrievable via CircuitBreakerRegistry.getConfiguration(name), which
# DynamicCircuitBreakerLookup requires on every lookup. An entry declared
# only under instances.* creates the CircuitBreaker eagerly at startup but is
# NOT retrievable as a named configuration - using that form here previously
# caused every API2/LIS call to fail at runtime with "No resilience4j circuit
# breaker config template named 'api2'/'lis'". The instance is still created
# lazily on first use, exactly like the per-provider ones.
resilience4j.circuitbreaker.configs.api2.base-config=default
# 4xx business-fault exceptions (not-found, validation, conflict, our own
# missing-bearer-token bug) are caller-side, never a signal that API2 itself
# is unhealthy, so they must not count against the breaker.
resilience4j.circuitbreaker.configs.api2.ignore-exceptions=\
uz.uzinfocom.app.integration.api2.citizen.exception.CitizenDataNotFoundException,\
uz.uzinfocom.app.integration.api2.citizen.exception.CitizenLookupValidationException,\
uz.uzinfocom.app.integration.api2.citizen.exception.UnsupportedCitizenLookupTypeException,\
uz.uzinfocom.app.integration.api2.legalentity.exception.LegalEntityNotFoundException,\
uz.uzinfocom.app.integration.api2.legalentity.exception.LegalEntityValidationException,\
uz.uzinfocom.app.integration.api2.common.exception.Api2BadRequestException,\
uz.uzinfocom.app.integration.api2.common.exception.Api2ConflictException,\
uz.uzinfocom.app.integration.api2.common.exception.Api2MissingBearerTokenException

# LIS - one shared instance (see LisActClient). Same configs.* vs instances.*
# reasoning as api2 above.
resilience4j.circuitbreaker.configs.lis.base-config=default
resilience4j.circuitbreaker.configs.lis.ignore-exceptions=\
uz.uzinfocom.app.integration.lis.common.exception.LisBadRequestException,\
uz.uzinfocom.app.integration.lis.common.exception.LisUnsupportedActTypeException

# IAM remote / OAuth2 login / RSA public key are all multi-tenant (one
# provider per configured SSO, e.g. sso/dhp), so these are config
# *templates*, not instances - each client creates one breaker per provider
# key at runtime from the matching template below.
resilience4j.circuitbreaker.configs.iam-remote.base-config=default
resilience4j.circuitbreaker.configs.iam-remote.sliding-window-size=10
resilience4j.circuitbreaker.configs.iam-remote.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.iam-remote.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.configs.oauth2-login.base-config=default
resilience4j.circuitbreaker.configs.oauth2-login.sliding-window-size=10
resilience4j.circuitbreaker.configs.oauth2-login.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.oauth2-login.wait-duration-in-open-state=20s
# Bad code/PKCE verifier from the end user is never a signal the provider is
# down. A misconfigured client_id/secret (LoginProviderMisconfiguredException)
# is deliberately NOT ignored here - that really is "this integration is
# broken" and should trip fast so it gets noticed.
resilience4j.circuitbreaker.configs.oauth2-login.ignore-exceptions=\
uz.uzinfocom.app.platform.ssoproxy.application.exception.InvalidLoginCredentialsException,\
uz.uzinfocom.app.platform.ssoproxy.application.exception.InvalidLoginRequestException

resilience4j.circuitbreaker.configs.rsa-public-key.base-config=default
resilience4j.circuitbreaker.configs.rsa-public-key.sliding-window-size=5
resilience4j.circuitbreaker.configs.rsa-public-key.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.rsa-public-key.wait-duration-in-open-state=15s

# Outbound webhook - one config template shared by every IntegrationClient's
# callback (see OutboundWebhookClient), instance name per client id at
# runtime - same configs.* vs instances.* reasoning as iam-remote above.
resilience4j.circuitbreaker.configs.outbound-webhook.base-config=default
resilience4j.circuitbreaker.configs.outbound-webhook.sliding-window-size=10
resilience4j.circuitbreaker.configs.outbound-webhook.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.outbound-webhook.wait-duration-in-open-state=30s

# Circuit-breaker state must not affect this app's own liveness/readiness -
# a degraded external dependency shouldn't get our own pods killed/drained.
# Metrics stay available regardless via /v1/actuator/prometheus
# (resilience4j_circuitbreaker_* series), which is the intended way to
# observe/alert on breaker state.
management.health.circuitbreakers.enabled=false

# The values above are just the startup defaults. DynamicCircuitBreakerLookup
# re-resolves every one of them on every outbound call from the dev-panel
# system_settings table (/v1/dev/**, DevSettingController), under keys:
#   resilience.circuitbreaker.<name>.failure-rate-threshold
#   resilience.circuitbreaker.<name>.sliding-window-size
#   resilience.circuitbreaker.<name>.minimum-number-of-calls
#   resilience.circuitbreaker.<name>.wait-duration-in-open-state-seconds
#   resilience.circuitbreaker.<name>.slow-call-rate-threshold
#   resilience.circuitbreaker.<name>.slow-call-duration-threshold-seconds
#   resilience.circuitbreaker.<name>.permitted-number-of-calls-in-half-open-state
#   resilience.circuitbreaker.<name>.automatic-transition-from-open-to-half-open-state
# where <name> is api2, lis, iam-remote, oauth2-login, rsa-public-key, or outbound-webhook.
# An untouched settings table behaves exactly like the static values above -
# no separate action needed to opt in. Every key above is pre-seeded (see
# db.migration/changelog/settings/20260729-1200-... and 20260729-1300-...)
# so all 40 rows already show up in the dev panel, ready to edit.
