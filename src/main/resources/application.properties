# =========================================================
# Application
# =========================================================
spring.application.name=isemid

server.port=8081
server.http2.enabled=true
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


# =========================================================
# REST API Timezone
# =========================================================
spring.jackson.time-zone=Asia/Tashkent
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tashkent


# =========================================================
# Database
# =========================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5434/isemid?options=-c%20TimeZone=Asia/Tashkent
spring.datasource.username=postgres
spring.datasource.password=root123


# =========================================================
# HikariCP
# =========================================================
spring.datasource.hikari.pool-name=IsemidHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=0


# =========================================================
# Liquibase
# =========================================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.migration/db.changelog-master.yaml
spring.liquibase.liquibase-schema=public


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate performance defaults for REST APIs.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# SQL logging must not use TRACE in high-load APIs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false


# =========================================================
# Multipart
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# OpenAPI / Swagger
# Test environment: enabled.
# Production-ready approach: this can be disabled later without code changes.
# =========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# =========================================================
# Actuator / Monitoring
# Test environment: metrics endpoint is available.
# Production-ready approach: secure actuator endpoints through Spring Security.
# =========================================================
management.endpoints.web.base-path=/v1/actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.metrics.enable.all=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99


# =========================================================
# Response Compression
# =========================================================
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,application/xml,text/plain,text/css,text/javascript,application/javascript


# =========================================================
# Error Response
# Test environment: validation messages are visible.
# Stacktrace remains disabled to avoid leaking internals.
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false


# =========================================================
# Logging
# =========================================================
logging.charset.console=UTF-8
logging.charset.file=UTF-8

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
#logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.zaxxer.hikari=INFO

# Keep both package names temporarily if old modules still exist.
logging.level.uz.uzinfocom.isemid=DEBUG
logging.level.uz.uzinfocom.hepatitis=DEBUG

logging.file.name=logs/isemid-app.log
logging.logback.rollingpolicy.file-name-pattern=logs/isemid-app.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=5GB


# =========================================================
# Integration Hosts
# Common base URLs are defined once and reused by URL factories.
# =========================================================
isemid.integration.hosts.ssv-api-base-url=https://test-api2.ssv.uz
isemid.integration.hosts.sso-base-url=http://test-sso.ssv.uz
isemid.integration.hosts.lis-public-api-base-url=https://test-lis.sanepid.uz/api/v1/publicapi
isemid.integration.hosts.lis-act-integration-base-url=https://test-lis.sanepid.uz/api/v1/act/integration
isemid.integration.hosts.isemid-public-api-base-url=https://test-ykem.sanepid.uz/api
isemid.integration.hosts.local-api-base-url=http://localhost:8081


# =========================================================
# Integration Paths
# Paths are separated from hosts to avoid duplicated hardcoded URLs.
# =========================================================

# SSO
isemid.integration.paths.sso-token-path=/oauth/token
isemid.integration.paths.sso-logout-path=/api/auth/logout
isemid.integration.paths.sso-public-key-path=/public-key

# SSV API
isemid.integration.paths.practitioner-path=/v2/Practitioner/{id}
isemid.integration.paths.organization-path=/v2/Organization/{id}
isemid.integration.paths.citizen-path=/v3/Citizen
isemid.integration.paths.child-path=/v3/Child
isemid.integration.paths.legal-entity-path=/v3/LegalEntity
isemid.integration.paths.vaccination-path=/Vaccination/{id}

# LIS
isemid.integration.paths.lis-create-act-path=/create-act/{actType}
isemid.integration.paths.lis-act-code-path=/act-code
isemid.integration.paths.lis-callback-path=/v1/act/lis/callback/


# =========================================================
# Integration Keys
# For real production, this value must come from environment variables or secret storage.
# For test-only usage, it can be placed here if the repository is private.
# =========================================================
isemid.integration.keys.lis-api-key=


# =========================================================
# Integration HTTP Client
# =========================================================
isemid.integration.http.connect-timeout=2s
isemid.integration.http.read-timeout=5s