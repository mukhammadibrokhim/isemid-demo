server.address = 127.0.0.1
server.port=6002
spring.application.name=EMIS

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/emis
spring.datasource.username=postgres
spring.datasource.password=1
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialet= org.postgresql.util.PSQLException
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

server.servlet.session.timeout=3600s
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true

file.path=./images/

#########################MIS CONFIGURATION###################################
mis.practitioner.info.url=https://test-api2.ssv.uz/v2/Practitioner/
mis.patient-info-by-pinfl.url=https://test-api2.ssv.uz/v3/Citizen/
mis.pinfl.code=NNUZB

jwt.public.
