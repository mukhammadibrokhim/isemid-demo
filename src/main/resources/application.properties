spring.application.name=isemid

server.port=8081
server.http2.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:5432/isemid?options=-c%20TimeZone=Asia/Tashkent
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root123
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create

springdoc.api-docs.path=/api-docs

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring log level
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
# logging.level.org.hibernate.SQL=DEBUG

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.enable.all=true

# application log level
logging.level.uz.uzinfocom.hepatitis=INFO
logging.level.root=ERROR

#INIT
runner.main.init=true
runner.role_permission.init=true
runner.mkb10.init=true
runner.catalog.init=true