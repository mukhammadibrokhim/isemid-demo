spring.application.name=isemid

server.port=8081
server.http2.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:5434/isemid?options=-c%20TimeZone=Asia/Tashkent
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root123
#spring.jpa.open-in-view= true

spring.liquibase.change-log=classpath:db.migration/db.changelog-master.yaml
spring.liquibase.liquibase-schema=public
spring.liquibase.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.api-docs.path=/api-docs

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring log level
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql= TRACE
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.enable.all=true

# application log level
logging.level.uz.uzinfocom.hepatitis=INFO
logging.level.root=ERROR

#INIT
runner.main.init=true
runner.role_permission.init=true
runner.mkb10.init=true
runner.catalog.init=true