# =========================================================
# Application
# =========================================================
spring.application.name=isemid

server.port=${SERVER_PORT:8082}
server.http2.enabled=true
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


# =========================================================
# Timezone
# =========================================================
spring.jackson.time-zone=Asia/Tashkent
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tashkent


# =========================================================
# Database
# =========================================================
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the existing database URL unchanged.
spring.datasource.url=jdbc:postgresql://localhost:5432/emis?options=-c%20TimeZone=Asia/Tashkent

# Do not store production credentials in configuration files.
# Provide these values through environment variables or secret storage.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root123}


# =========================================================
# HikariCP
# =========================================================
spring.datasource.hikari.pool-name=IsemidHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=0


# =========================================================
# Liquibase
# =========================================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.migration/db.changelog-master.yaml
spring.liquibase.liquibase-schema=public


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Hibernate performance defaults for REST APIs.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true


# =========================================================
# Report Export (Form058 V3 async export)
# =========================================================
# Fon jarayonida tayyorlangan hisobot fayllari shu papkada, report turi bo'yicha
# pastki papkalarda saqlanadi. Kesh muddati tugagach (5 daqiqa), eski fayllar
# avtomatik o'chiriladi.
isemid.report.export-dir=${REPORT_EXPORT_DIR:./export-files}


# =========================================================
# Multipart
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}


# =========================================================
# OpenAPI / Swagger
# =========================================================
# Production default: disabled.
# Enable only for development or secured internal environments.
# Example:
# OPENAPI_ENABLED=true
# SWAGGER_UI_ENABLED=true
# =========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}


# =========================================================
# Actuator / Monitoring
# =========================================================
# Expose only infrastructure-required endpoints.
# The Prometheus endpoint must be protected by Spring Security or network policy.
# =========================================================
management.endpoints.web.base-path=/v1/actuator
management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.metrics.enable.all=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99


# =========================================================
# Response Compression
# =========================================================
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,application/xml,text/plain,text/css,text/javascript,application/javascript


# =========================================================
# Error Response
# =========================================================
# Production-safe error handling.
# Do not expose internal exception messages, binding details, stack traces, or exception class names.
# Public validation errors should be returned by GlobalExceptionHandler.
# =========================================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# =========================================================
# Logging
# =========================================================
# Main logging configuration is managed in logback-spring.xml.
# Do not duplicate file rolling policy here.
# =========================================================
logging.config=classpath:logback.xml

logging.charset.console=UTF-8
logging.charset.file=UTF-8


