spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

logging.level.uz.uzinfocom.app=INFO
logging.level.org.springframework.security=WARN

app.base-uri=${APP_BASE_URI:https://ykem.sanepid.uz}

# =========================
# CORS - PROD
# =========================
# No default - the real prod frontend origin(s) must be supplied via env
# var. Left empty, no cross-origin browser request is allowed (safe
# default) rather than falling back to something permissive.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}


# =========================
# SSV SSO - PROD
# =========================
app.auth.providers.sso.enabled=true
app.auth.providers.sso.auth-base-domain=${SSO_AUTH_BASE_DOMAIN:https://sso.ssv.uz}
app.auth.providers.sso.iam-api-base-domain=${SSO_IAM_API_BASE_DOMAIN:https://api2.ssv.uz}

app.auth.providers.sso.issuer-uri=${SSO_ISSUER_URI:${app.auth.providers.sso.auth-base-domain}}
app.auth.providers.sso.signature-mode=PUBLIC_KEY_ENDPOINT
app.auth.providers.sso.public-key-uri=${SSO_PUBLIC_KEY_URI:${app.auth.providers.sso.auth-base-domain}/public-key}

app.auth.providers.sso.validate-audience=false
app.auth.providers.sso.validate-issuer=true
app.auth.providers.sso.missing-issuer-marker-claim=user_info
app.auth.providers.sso.audiences=

app.auth.providers.sso.iam.organization-url-template=${SSO_ORGANIZATION_URL_TEMPLATE:${app.auth.providers.sso.iam-api-base-domain}/v2/Organization/{uuid}}
app.auth.providers.sso.iam.practitioner-url-template=${SSO_PRACTITIONER_URL_TEMPLATE:${app.auth.providers.sso.iam-api-base-domain}/v2/Practitioner/{uuid}}


# =========================
# DHP - PROD
# =========================
app.auth.providers.dhp.enabled=true
app.auth.providers.dhp.auth-base-domain=${DHP_AUTH_BASE_DOMAIN:https://sso.dhp.uz}
app.auth.providers.dhp.fhir-base-domain=${DHP_FHIR_BASE_DOMAIN:https://fhir.dhp.uz}

app.auth.providers.dhp.issuer-uri=${DHP_ISSUER_URI:${app.auth.providers.dhp.auth-base-domain}}
app.auth.providers.dhp.signature-mode=JWKS_URI
app.auth.providers.dhp.jwk-set-uri=${DHP_JWKS_URI:${app.auth.providers.dhp.auth-base-domain}/.well-known/jwks.json}

app.auth.providers.dhp.validate-issuer=true
app.auth.providers.dhp.validate-audience=false
app.auth.providers.dhp.audiences=

app.auth.providers.dhp.iam.organization-url-template=${DHP_ORGANIZATION_URL_TEMPLATE:${app.auth.providers.dhp.fhir-base-domain}/Organization/{uuid}}
app.auth.providers.dhp.iam.practitioner-url-template=${DHP_PRACTITIONER_URL_TEMPLATE:${app.auth.providers.dhp.fhir-base-domain}/Practitioner/{uuid}}


# =========================
# Login proxy - authorization_code + PKCE (redirect-based web flows) - PROD
# =========================
# No literal defaults here (unlike dev) - real client_id/client_secret must
# be supplied via env vars in the prod environment, never committed.
# grant-type not set here - AUTHORIZATION_CODE is the default and only
# supported grant today (see LoginProvidersProperties.ProviderProperties);
# the legacy password-grant login was removed once redirect-based login
# covered every provider.

# SSO's public-SPA authorization_code + PKCE client (see the dev profile for
# the confirmed request shape) - real prod client_id must be supplied via
# env var; only the dev/test client is confirmed working so far.
app.auth.login.providers.sso-web.enabled=true
app.auth.login.providers.sso-web.token-url=${SSO_WEB_LOGIN_TOKEN_URL:https://sso.ssv.uz/oauth/token}
app.auth.login.providers.sso-web.client-id=${SSO_WEB_LOGIN_CLIENT_ID:}
app.auth.login.providers.sso-web.require-client-secret=false
app.auth.login.providers.sso-web.extra-params.claims=organization

# DHP login flow (authorization_code + PKCE, see docs/auth-login-module.md) -
# provider key "dhp-web" to stay distinct from app.auth.providers.dhp.*
# above (unrelated inbound-JWT-validation config, must stay "dhp" - see the
# dev profile comment). Disabled until real prod client_id/client_secret and
# token-url are supplied via env vars; only the dev/playground environment
# is configured with real values so far.
app.auth.login.providers.dhp-web.enabled=false
app.auth.login.providers.dhp-web.token-url=${DHP_WEB_LOGIN_TOKEN_URL:}
app.auth.login.providers.dhp-web.client-id=${DHP_WEB_LOGIN_CLIENT_ID:}
app.auth.login.providers.dhp-web.client-secret=${DHP_WEB_LOGIN_CLIENT_SECRET:}