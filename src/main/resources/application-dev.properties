spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/isemid2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root123}
spring.jpa.show-sql=false

logging.level.uz.uzinfocom.app=DEBUG
logging.level.org.springframework.security=INFO

app.base-uri=https://test-ykem.sanepid.uz/api

# =========================
# CORS - DEV / TEST
# =========================
# Frontend dev server origin(s) allowed to call this API from the browser
# (login-proxy endpoints in particular are meant to be called directly from
# a SPA). Comma-separated list.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# =========================
# SSV SSO - DEV / TEST
# =========================
app.auth.providers.sso.enabled=true
app.auth.providers.sso.auth-base-domain=${SSO_AUTH_BASE_DOMAIN:https://test-sso.ssv.uz}
app.auth.providers.sso.iam-api-base-domain=${SSO_IAM_API_BASE_DOMAIN:https://test-api2.ssv.uz}
app.auth.providers.sso.issuer-uri=${SSO_ISSUER_URI:${app.auth.providers.sso.auth-base-domain}}
app.auth.providers.sso.signature-mode=PUBLIC_KEY_ENDPOINT
app.auth.providers.sso.public-key-uri=${SSO_PUBLIC_KEY_URI:${app.auth.providers.sso.auth-base-domain}/public-key}
app.auth.providers.sso.validate-audience=false
app.auth.providers.sso.validate-issuer=false
app.auth.providers.sso.missing-issuer-marker-claim=user_info
app.auth.providers.sso.audiences=
app.auth.providers.sso.iam.organization-url-template=${SSO_ORGANIZATION_URL_TEMPLATE:${app.auth.providers.sso.iam-api-base-domain}/v2/Organization/{uuid}}
app.auth.providers.sso.iam.practitioner-url-template=${SSO_PRACTITIONER_URL_TEMPLATE:${app.auth.providers.sso.iam-api-base-domain}/v2/Practitioner/{uuid}}


# =========================
# DHP - PLAYGROUND
# =========================
app.auth.providers.dhp.enabled=true
app.auth.providers.dhp.auth-base-domain=${DHP_AUTH_BASE_DOMAIN:https://playground.dhp.uz/sso}
app.auth.providers.dhp.fhir-base-domain=${DHP_FHIR_BASE_DOMAIN:https://playground.dhp.uz/fhir}
app.auth.providers.dhp.issuer-uri=${DHP_ISSUER_URI:${app.auth.providers.dhp.auth-base-domain}}
app.auth.providers.dhp.signature-mode=JWKS_URI
app.auth.providers.dhp.jwk-set-uri=${DHP_JWKS_URI:${app.auth.providers.dhp.auth-base-domain}/.well-known/jwks.json}
app.auth.providers.dhp.validate-issuer=true
app.auth.providers.dhp.validate-audience=false
app.auth.providers.dhp.audiences=
app.auth.providers.dhp.iam.organization-url-template=${DHP_ORGANIZATION_URL_TEMPLATE:${app.auth.providers.dhp.fhir-base-domain}/Organization/{uuid}}
app.auth.providers.dhp.iam.practitioner-url-template=${DHP_PRACTITIONER_URL_TEMPLATE:${app.auth.providers.dhp.fhir-base-domain}/Practitioner/{uuid}}

# =========================
# Login proxy - authorization_code + PKCE (redirect-based web flows) - DEV / TEST
# =========================
# grant-type not set here - AUTHORIZATION_CODE is the default and only
# supported grant today (see LoginProvidersProperties.ProviderProperties);
# the legacy password-grant login was removed once redirect-based login
# covered every provider.

# SSO's public-SPA client registration for authorization_code + PKCE. No
# client_secret: this client authenticates with code_verifier alone
# (require-client-secret=false), and requires an extra static
# "claims=organization" form field.
app.auth.login.providers.sso-web.enabled=true
app.auth.login.providers.sso-web.token-url=${SSO_WEB_LOGIN_TOKEN_URL:https://test-sso.ssv.uz/oauth/token}
app.auth.login.providers.sso-web.client-id=${SSO_WEB_LOGIN_CLIENT_ID:97c3e637-6441-4cbe-95fa-5cbf6fb907a3}
app.auth.login.providers.sso-web.require-client-secret=false
app.auth.login.providers.sso-web.extra-params.claims=organization

# DHP dev environment - authorization_code + PKCE. Provider key "dhp-web"
# (not "dhp") to keep it distinct from app.auth.providers.dhp.* above, which
# is the unrelated inbound-JWT-validation config for DHP-issued bearer
# tokens (see platform.security) - that key is matched against
# DhpIdentityClaimExtractor and must stay "dhp".
#
# token-url is https://dev.dhp.uz/sso/oauth/token - NOT playground.dhp.uz.
# Confirmed live: this exact client_id/client_secret returns invalid_client
# on playground.dhp.uz (wrong server for this client) but invalid_grant
# (client accepted, only the fake code rejected) on dev.dhp.uz. Despite
# being called a "public spa" client, it does require client_secret in the
# body - confirmed live (omitting it returns invalid_client).
app.auth.login.providers.dhp-web.enabled=true
app.auth.login.providers.dhp-web.token-url=${DHP_WEB_LOGIN_TOKEN_URL:https://dev.dhp.uz/sso/oauth/token}
app.auth.login.providers.dhp-web.client-id=${DHP_WEB_LOGIN_CLIENT_ID:emid.conf.web}
app.auth.login.providers.dhp-web.client-secret=${DHP_WEB_LOGIN_CLIENT_SECRET:lu8LXaKDuUlbBNCMIhIWcDyPThw-P4roKbDbDxPAoEg}
app.auth.login.providers.dhp-web.credentials-in-basic-header=false

