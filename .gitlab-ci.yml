include:
  - project: core/templates/global-ci
    ref: main
    file: prepare.yml
  - project: core/templates/global-ci
    ref: main
    file: build.yml
  - project: core/templates/global-ci
    ref: main
    file: gitops.yml
  - project: 'core/templates/global-ci'
    ref: 'main'
    file: '.global-gitlab-ci.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        IMAGE_PREFIX: "dev"
        DOCKERFILE: "Dockerfile"
        GITOPS_IMAGE: "emis-ykem-backend-image"
        KUSTOMIZATION_FILE: "backend/overlays/dev/kustomization.yaml"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

variables:
  IMAGE_NAME: "${HARBOR_REGISTRY}/${CI_PROJECT_PATH}"
  GITOPS_REPOSITORY: "git.uzinfocom.uz/core/manifests/moh/emis-ykem.git"
  GITOPS_TOKEN: "${GITOPS_TOKEN_MOH}"
  PROD_SERVER: '10.10.10.133'
  PRODUCTION_USER: 'runner'

stages:
  - validate-and-check
  - check-stage
  - prepare
  - build
  - gitops
  - build_and_push_prod

check-stage:
  stage: check-stage
  image: maven:3-eclipse-temurin-25-alpine
  needs:
    - check_gitlab_ci_yml
  before_script:
    - apk add --no-cache curl bash
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - SONAR_P_KEY=$(grep 'sonar.projectKey' pom.xml | cut -d'=' -f2 | tr -d '\r ' )
    - SONAR_P_NAME=$(grep 'sonar.projectName' pom.xml | cut -d'=' -f2 | tr -d '\r ' )
    - SAFE_NAME=$(echo "$SONAR_P_NAME" | sed 's/ /_/g')
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.login="${SONAR_TOKEN_ANALYSIS}" || true
    - sleep 30
    - mkdir -p sonar_reports
    - curl -k -s -u "${SONAR_TOKEN_ANALYSIS}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_P_KEY}" -o "sonar_reports/quality_gate.json"
    - curl -k -s -u "${SONAR_TOKEN_ANALYSIS}:" "${SONAR_HOST_URL}/api/measures/component?component=${SONAR_P_KEY}&metricKeys=ncloc,lines,complexity,violations,coverage,bugs,vulnerabilities,code_smells,duplicated_lines_density,security_hotspots,sqale_index" -o "sonar_reports/metrics.json"
    - curl -k -s -u "${SONAR_TOKEN_ANALYSIS}:" "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_P_KEY}&ps=500&resolved=false" -o "sonar_reports/issues.json"
    - curl -k -s -u "${SONAR_TOKEN_ANALYSIS}:" "${SONAR_HOST_URL}/api/hotspots/search?projectKey=${SONAR_P_KEY}&ps=500" -o "sonar_reports/hotspots.json"
    - curl -k -s -u "${SONAR_TOKEN_ANALYSIS}:" "${SONAR_HOST_URL}/api/measures/component_tree?component=${SONAR_P_KEY}&metricKeys=ncloc,bugs,code_smells,vulnerabilities,coverage&ps=500" -o "sonar_reports/file_breakdown.json"
    - curl -k -s -u "${SONAR_TOKEN_ANALYSIS}:" "${SONAR_HOST_URL}/api/measures/search_history?component=${SONAR_P_KEY}&metrics=bugs,vulnerabilities,code_smells,coverage" -o "sonar_reports/history.json"
    - curl -k -s -u "${SONAR_TOKEN_ANALYSIS}:" "${SONAR_HOST_URL}/api/project_analyses/search?project=${SONAR_P_KEY}" -o "sonar_reports/project_info.json"
    - ARTIFACT_NAME="sonar_report_${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}.tar.gz"
    - tar -czf "$ARTIFACT_NAME" sonar_reports/
    - "echo DOWNLOAD_URL: ${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/${ARTIFACT_NAME}"
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 20 mins
    when: always
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
    - if: $CI_COMMIT_BRANCH == 'main'
      when: manual
    - if: $CI_COMMIT_BRANCH == 'dev'
      when: manual

prepare:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

build_image:
  extends: .build_template
  needs:
    - check_gitlab_ci_yml
    - job: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  variables:
    BUILD_RUNNER_TAG: "moh-runner-dind"
    IMAGE_NAME_FULL: "${IMAGE_NAME}"

update_gitops:
  extends: .gitops_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  needs:
    - job: prepare
      artifacts: true
    - job: build_image
  variables:
    IMAGE_NAME_FULL: "${IMAGE_NAME}"

deploy_prod:
  image: maven:3-eclipse-temurin-25-alpine
  stage: build_and_push_prod
  needs:
    - check_gitlab_ci_yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client git curl bash
    - eval $(ssh-agent -s)
    - chmod 600 $MOH_PRIVATE_KEY
  script:
    - echo "Deploying to PROD server"
    - mvn clean package -DskipTests

    - | # Stoping service
      ssh -oStrictHostKeyChecking=no -i $MOH_PRIVATE_KEY  $PRODUCTION_USER@$PROD_SERVER << 'EOF'
        sudo systemctl stop backend.service


        if [ -f /srv/project/backend/app.jar ]; then
          sudo mv /srv/project/backend/app.jar /srv/project/backend/app_previous.jar
        fi
        sudo chown -R runner:runner /srv/project/backend
      EOF
    - | # Copying the built binary
      scp -O -oStrictHostKeyChecking=no -i $MOH_PRIVATE_KEY \
        `pwd`/target/app*.jar $PRODUCTION_USER@$PROD_SERVER:/srv/project/backend/app.jar


    - | # Create privilages & run service
      ssh -oStrictHostKeyChecking=no -i $MOH_PRIVATE_KEY  $PRODUCTION_USER@$PROD_SERVER << 'EOF'
        sudo chown -R nginx:nginx /srv/project/backend
        sudo systemctl restart backend.service
        sleep 10
        sudo systemctl status backend.service
      EOF

    - echo "Deploy finished"